<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Mira Chen — Digital Product Designer</title>
  <style>
    :root{--ink:#16211d;--soft:#edf3ef;--accent:#d8ff72}*{box-sizing:border-box}body{margin:0;background:#f8faf8;color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}
    main{width:min(1040px,calc(100% - 40px));margin:auto}header{height:82px;display:flex;align-items:center;justify-content:space-between}.name{font-weight:800}.links{color:#5f6b65;font-size:14px}
    .hero{padding:11vh 0 9vh;display:grid;grid-template-columns:1.4fr .6fr;gap:50px;align-items:end}.eyebrow{font-size:13px;text-transform:uppercase;letter-spacing:.16em}.hero h1{font-size:clamp(48px,8vw,92px);letter-spacing:-.055em;line-height:.95;margin:18px 0 0}.intro{color:#53605a;margin:0 0 8px}
    .work{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;padding-bottom:70px}.project{min-height:220px;border-radius:18px;padding:24px;display:flex;flex-direction:column;justify-content:flex-end;background:var(--soft)}.project:nth-child(2){background:var(--accent)}.project:nth-child(3){background:#202b26;color:#fff}.project b{font-size:20px}.project span{font-size:13px;opacity:.7;margin-top:5px}
    footer{border-top:1px solid #dfe6e1;padding:24px 0 38px;color:#69756f;font-size:13px}@media(max-width:740px){.hero{grid-template-columns:1fr}.work{grid-template-columns:1fr}.project{min-height:170px}}
  </style>
</head>
<body>
  <main>
    <header><div class="name">Mira Chen</div><div class="links">Selected work · 2026</div></header>
    <section class="hero"><div><div class="eyebrow">Independent designer</div><h1>Useful ideas,<br>made clear.</h1></div><p class="intro">I design calm, practical digital products for small teams and ambitious organizations.</p></section>
    <section class="work"><div class="project"><b>Field Notes</b><span>Research platform</span></div><div class="project"><b>Common Ground</b><span>Community toolkit</span></div><div class="project"><b>Signal House</b><span>Identity and web</span></div></section>
    <footer>Available for selected collaborations.</footer>
  </main>
</body>
</html>
